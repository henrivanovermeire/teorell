name: Publish to TestPyPI

# Default publish path: GitHub Release → TestPyPI (dry run before production).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/teorell-core/
    permissions:
      id-token: write  # Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG#v}"
          PKG="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "GitHub release tag (stripped): ${TAG}"
          echo "pyproject.toml version:       ${PKG}"
          if [[ "${TAG}" != "${PKG}" ]]; then
            echo "::error::Release tag v${PKG} required (got '${GITHUB_REF_NAME}'). Bump version in pyproject.toml to match."
            exit 1
          fi

      - name: Run tests
        run: pytest -q

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          names = zipfile.ZipFile(wheels[0]).namelist()
          bad = [n for n in names if n.startswith("web/") or "/web/" in n]
          assert not bad, f"web UI leaked into wheel: {bad[:10]}"
          print("wheel ok:", wheels[0].name, f"({len(names)} files)")
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
