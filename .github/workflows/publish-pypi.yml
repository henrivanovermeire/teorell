name: Publish to PyPI

# Production upload — run manually AFTER verifying the same version on TestPyPI.
# Actions → Publish to PyPI → Run workflow.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to confirm production PyPI upload'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    environment:
      name: pypi
      url: https://pypi.org/p/teorell-core
    permissions:
      id-token: write  # Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          names = zipfile.ZipFile(wheels[0]).namelist()
          bad = [n for n in names if n.startswith("web/") or "/web/" in n]
          assert not bad, f"web UI leaked into wheel: {bad[:10]}"
          print("wheel ok:", wheels[0].name, f"({len(names)} files)")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
