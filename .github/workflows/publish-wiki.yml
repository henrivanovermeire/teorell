name: Publish Wiki

on:
  push:
    branches: [main, master]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/wiki → GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.wiki.git"

          git_cfg() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          # Best-effort: turn Wikis on (needs token rights; ignore failure).
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}" \
            -d '{"has_wiki":true}' >/tmp/wiki-enable.json || true

          rm -rf .wiki-tmp
          if git clone --depth 1 "$WIKI_URL" .wiki-tmp 2>/tmp/wiki-clone.err; then
            find .wiki-tmp -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a docs/wiki/. .wiki-tmp/
            cd .wiki-tmp
            git_cfg
            git add -A
            if git diff --staged --quiet; then
              echo "Wiki already up to date."
              exit 0
            fi
            git commit -m "Sync wiki from docs/wiki (${GITHUB_SHA::7})"
            git push
            exit 0
          fi

          echo "Wiki clone failed; bootstrapping ${GH_REPO}.wiki.git …"
          cat /tmp/wiki-clone.err || true

          mkdir .wiki-tmp
          cp -a docs/wiki/. .wiki-tmp/
          cd .wiki-tmp
          git init
          # GitHub Wikis still default to "master"
          git checkout -b master
          git_cfg
          git add -A
          git commit -m "Initial wiki from docs/wiki (${GITHUB_SHA::7})"
          git remote add origin "$WIKI_URL"
          if ! git push -u origin master; then
            echo "::error::Could not create/push the wiki."
            echo "1. Repo Settings → General → Features → enable Wikis"
            echo "2. Open the Wiki tab once (GitHub may create an empty Home)"
            echo "3. Re-run this workflow"
            exit 1
          fi
